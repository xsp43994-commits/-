   </g>
   <g id="text_2">
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #334155" transform="translate(14.284043 58.035798)">fixed points, priorities,</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #334155" transform="translate(14.641543 64.910767)">terrain, wind, budgets</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial'; text-anchor: middle" x="129.46748" y="49.336742" transform="rotate(-0 129.46748 49.336742)">Priority encoder</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #334155" transform="translate(101.646465 58.034275)">15-D node features</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #334155" transform="translate(99.83916 64.909244)">4-head self-attention</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial'; text-anchor: middle" x="213.222402" y="49.336742" transform="rotate(-0 213.222402 49.336742)">Pointer policy</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #334155" transform="translate(182.845058 57.996189)">UAV query + glimpse</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #334155" transform="translate(181.607011 64.94733)">variable candidate set</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial'; text-anchor: middle" x="296.977323" y="49.385961" transform="rotate(-0 296.977323 49.385961)">Return-aware mask</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #334155" transform="translate(273.512323 54.512291)">visit ∩ dynamics</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #334155" transform="translate(267.55619 61.563369)">∩ energy ∩ distance</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #334155" transform="translate(271.882245 68.514509)">∩ time and return</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial'; text-anchor: middle" x="370.681654" y="49.385961" transform="rotate(-0 370.681654 49.385961)">Action</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #334155" transform="translate(361.2922 58.034275)">visit or</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #334155" transform="translate(362.192552 64.909244)">return</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: middle" x="112.716496" y="129.793858" transform="rotate(-0 112.716496 129.793858)">PPO learning</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.1px; font-family: 'Arial'; fill: #334155" transform="translate(76.943332 138.673758)">clipped objective and GAE</text>
    <text style="font-size: 6.1px; font-family: 'Arial'; fill: #334155" transform="translate(77.871676 145.218867)">5 seeds × 3,000 episodes</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: middle" x="206.522008" y="129.797139" transform="rotate(-0 206.522008 129.797139)">Frozen evaluation</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.1px; font-family: 'Arial'; fill: #334155" transform="translate(175.666969 138.692248)">216 unseen-map tasks</text>
    <text style="font-size: 6.1px; font-family: 'Arial'; fill: #334155" transform="translate(167.448648 145.144142)">144 DSM tasks + robustness</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: middle" x="300.32752" y="129.839795" transform="rotate(-0 300.32752 129.839795)">Map-level inference</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.1px; font-family: 'Arial'; fill: #334155" transform="translate(273.545184 138.638587)">nonparametric tests</text>
    <text style="font-size: 6.1px; font-family: 'Arial'; fill: #334155" transform="translate(270.57334 145.179694)">HL effects + bootstrap</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial'; text-anchor: middle; fill: #17365d" x="203.171811" y="15.583465" transform="rotate(-0 203.171811 15.583465)">Return-aware PPO–Pointer planning and locked evidence pipeline</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.5px; font-family: 'Arial'; text-anchor: middle; fill: #475569" x="203.171811" y="170.699055" transform="rotate(-0 203.171811 170.699055)">Hard feasibility is enforced before action selection; reward shaping is secondary and separately ablated.</text>
   </g>
